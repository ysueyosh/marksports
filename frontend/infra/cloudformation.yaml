AWSTemplateFormatVersion: '2010-09-09'
Description: 'Frontend S3 + CloudFront Infrastructure for Next.js App'

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - stage
      - prod
    Description: Environment name
  DomainName:
    Type: String
    Description: Domain name for CloudFront (e.g., stage.mark-sports.com)
  CertificateArn:
    Type: String
    Description: ACM Certificate ARN for HTTPS

Conditions:
  IsProd: !Equals [!Ref Environment, 'prod']
  IsStageOrProd:
    !Or [
      !Equals [!Ref Environment, 'stage'],
      !Equals [!Ref Environment, 'prod'],
    ]

Resources:
  # S3 Bucket for Frontend
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ecsite-frontend-${Environment}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - '*'
            AllowedHeaders:
              - '*'
            MaxAgeSeconds: 3000
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # S3 Bucket Policy for CloudFront OAC
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution.Id}'

  # CloudFront Origin Access Control
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'ecsite-frontend-oac-${Environment}'
        OriginAccessControlType: s3
        SignBehavior: sign-requests

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Comment: !Sub 'Frontend distribution for ${Environment}'
        DefaultRootObject: index.html
        PriceClass: PriceClass_100

        # Domain Configuration
        Aliases: !If [IsStageOrProd, [!Ref DomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - IsStageOrProd
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        # Origin Configuration
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id

        # Default Cache Behavior (HTML files)
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          HttpVersion: http2
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 3600 # 1 hour for HTML
          MaxTTL: 86400 # 24 hours

        # Error Response for 404 -> index.html (SPA routing)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60

        # Cache Behavior for Static Assets
        CacheBehaviors:
          # Static assets (JS, CSS) - long cache
          - PathPattern: '/_next/static/*'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            HttpVersion: http2
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            MinTTL: 0
            DefaultTTL: 2592000 # 30 days for static assets
            MaxTTL: 31536000 # 1 year

          # Public assets - long cache
          - PathPattern: '/public/*'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            HttpVersion: http2
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            MinTTL: 0
            DefaultTTL: 2592000 # 30 days
            MaxTTL: 31536000 # 1 year

        # Security Headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
          FrameOptions:
            FrameOption: DENY
          XSSProtection:
            ModeBlock: true
            Protection: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
          ContentTypeOptions:
            ContentTypeOptionsBehavior: nosniff

      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  S3BucketName:
    Description: S3 bucket name for uploading frontend files
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub 'ecsite-frontend-bucket-${Environment}'

  S3BucketUrl:
    Description: S3 bucket URL
    Value: !GetAtt FrontendBucket.WebsiteURL
    Export:
      Name: !Sub 'ecsite-frontend-s3-url-${Environment}'

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub 'ecsite-frontend-cf-id-${Environment}'

  CloudFrontDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub 'ecsite-frontend-cf-domain-${Environment}'

  CustomDomainName:
    Description: Custom domain name for CloudFront
    Value:
      !If [
        IsStageOrProd,
        !Ref DomainName,
        !GetAtt CloudFrontDistribution.DomainName,
      ]
    Export:
      Name: !Sub 'ecsite-frontend-domain-${Environment}'
