service: ecsite-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  region: ap-northeast-1
  environment:
    DYNAMODB_TABLE: ${self:service}-${sls:stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.DYNAMODB_TABLE}'

functions:
  # Authentication
  login:
    handler: src.handlers.auth.login
    events:
      - httpApi:
          path: /login
          method: post

  requestPasswordReset:
    handler: src.handlers.auth.request_password_reset
    events:
      - httpApi:
          path: /password-reset/request
          method: post

  verifyResetToken:
    handler: src.handlers.auth.verify_reset_token
    events:
      - httpApi:
          path: /password-reset/verify
          method: post

  resetPassword:
    handler: src.handlers.auth.reset_password
    events:
      - httpApi:
          path: /password-reset/reset
          method: post

  # Admin Authentication
  adminLogin:
    handler: src.handlers.admin.admin_login
    events:
      - httpApi:
          path: /admin/login
          method: post

  adminRefreshToken:
    handler: src.handlers.admin.admin_refresh_token
    events:
      - httpApi:
          path: /admin/refresh-token
          method: post

  adminVerifyToken:
    handler: src.handlers.admin.admin_verify_token
    events:
      - httpApi:
          path: /admin/verify-token
          method: post

  createAdmin:
    handler: src.handlers.admin.create_admin
    events:
      - httpApi:
          path: /admin/create
          method: post

  # Address Management
  getAddresses:
    handler: src.handlers.address.get_addresses
    events:
      - httpApi:
          path: /addresses
          method: get

  addAddress:
    handler: src.handlers.address.add_address
    events:
      - httpApi:
          path: /addresses
          method: post

  updateAddress:
    handler: src.handlers.address.update_address
    events:
      - httpApi:
          path: /addresses/{id}
          method: put

  deleteAddress:
    handler: src.handlers.address.delete_address
    events:
      - httpApi:
          path: /addresses/{id}
          method: delete

  setMainAddress:
    handler: src.handlers.address.set_main_address
    events:
      - httpApi:
          path: /addresses/{id}/main
          method: put

  searchAddress:
    handler: src.handlers.address.search_address_handler
    events:
      - httpApi:
          path: /search-address
          method: post

  # Payment Method Management
  getPaymentMethods:
    handler: src.handlers.payment.get_payment_methods
    events:
      - httpApi:
          path: /payment-methods
          method: get

  addPaymentMethod:
    handler: src.handlers.payment.add_payment_method
    events:
      - httpApi:
          path: /payment-methods
          method: post

  deletePaymentMethod:
    handler: src.handlers.payment.delete_payment_method
    events:
      - httpApi:
          path: /payment-methods/{id}
          method: delete

  setDefaultPaymentMethod:
    handler: src.handlers.payment.set_default_payment_method
    events:
      - httpApi:
          path: /payment-methods/{id}/default
          method: put

  createPayment:
    handler: src.handlers.payment.create_payment
    events:
      - httpApi:
          path: /payments
          method: post

  health:
    handler: src.app.health_check
    events:
      - httpApi:
          path: /health
          method: get

resources:
  Resources:
    AdminTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}-admin
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI_MAIL
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}-users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI_MAIL
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

plugins:
  - serverless-offline
