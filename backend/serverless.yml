service: ecsite-backend

frameworkVersion: '4'

package:
  patterns:
    - '!node_modules/**'
    - '!venv/**'
    - '!.venv/**'
    - '!__pycache__/**'
    - '!.pytest_cache/**'
    - '!tests/**'
    - '!*.md'
    - '!.git/**'

provider:
  name: aws
  runtime: python3.11
  region: ap-northeast-1
  layers:
    - arn:aws:lambda:ap-northeast-1:681816819085:layer:ecsite-python-dependencies:3
  environment:
    DYNAMODB_TABLE: ${self:service}
    # Table names (stage-specific)
    USERS_TABLE_NAME: ${self:custom.dynamoTables.${sls:stage}.user}
    ADMIN_TABLE_NAME: ${self:custom.dynamoTables.${sls:stage}.admin}
    COMMERCE_TABLE_NAME: ${self:custom.dynamoTables.${sls:stage}.commerce}
    CART_TABLE_NAME: ${self:custom.dynamoTables.${sls:stage}.user}
    NOTIFICATION_TABLE_NAME: ${self:custom.dynamoTables.${sls:stage}.notification}
    # Square API (Lambda デプロイ時に AWS SSM Parameter Store から取得)
    SQUARE_ACCESS_TOKEN: ${ssm:/ecsite/${sls:stage}/SQUARE_ACCESS_TOKEN}
    SQUARE_ENVIRONMENT: ${sls:stage}
    # Email configuration (SES)
    ORDER_FROM_EMAIL: ${ssm:/ecsite/${sls:stage}/ORDER_FROM_EMAIL}
    # Frontend URL
    FRONTEND_URL: ${self:custom.frontendUrl.${sls:stage}}
    # S3 bucket for product images
    S3_BUCKET_NAME: ${self:custom.s3Bucket.${sls:stage}}
    # CloudFront domain for image delivery
    CLOUDFRONT_DOMAIN: ${self:custom.cloudfrontDomain.${sls:stage}}
  httpApi:
    metrics: false
    cors:
      allowedOrigins:
        - http://localhost:3000
        - http://localhost:5000
        - http://192.168.40.228:3000
        - https://marksports.example.com
      allowedHeaders:
        - '*'
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      maxAge: 86400
      allowCredentials: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
          Resource:
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/User-dev'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Admin-dev'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Commerce-dev'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Notification-dev'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/User-stage'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Admin-stage'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Commerce-stage'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Notification-stage'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/User-prod'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Admin-prod'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Commerce-prod'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Notification-prod'
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/User-dev/index/GSI_MAIL'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Admin-dev/index/GSI_MAIL'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Commerce-dev/index/GSI_COUPON_CODE'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/User-stage/index/GSI_MAIL'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Admin-stage/index/GSI_MAIL'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Commerce-stage/index/GSI_COUPON_CODE'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/User-prod/index/GSI_MAIL'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Admin-prod/index/GSI_MAIL'
            - 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/Commerce-prod/index/GSI_COUPON_CODE'
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:DeleteObject
            - s3:GetObject
            - s3:ListBucket
          Resource:
            - 'arn:aws:s3:::${self:provider.environment.S3_BUCKET_NAME}'
            - 'arn:aws:s3:::${self:provider.environment.S3_BUCKET_NAME}/*'
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - 'arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/ecsite/*'

custom:
  frontendUrl:
    dev: http://localhost:3000
    stage: https://stage.example.com
    prod: https://ecsite.example.com

  # DynamoDB tables per stage
  dynamoTables:
    dev:
      user: User-dev
      admin: Admin-dev
      commerce: Commerce-dev
      notification: Notification-dev
    stage:
      user: User-stage
      admin: Admin-stage
      commerce: Commerce-stage
      notification: Notification-stage
    prod:
      user: User-prod
      admin: Admin-prod
      commerce: Commerce-prod
      notification: Notification-prod

  # S3 bucket per stage (provided stage bucket name)
  s3Bucket:
    dev: marksports-image-dev
    stage: marksports-image-stage
    prod: marksports-image-prod

  # CloudFront domain per stage
  cloudfrontDomain:
    dev: d23pzr22xoegue.cloudfront.net
    stage: d1rxenf9seg5xc.cloudfront.net
    prod: d1rxenf9seg5xc.cloudfront.net

